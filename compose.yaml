# The site and a MariaDB server, for a machine without PHP: `docker compose up`, then sign in at
# http://localhost:8080/admin. See docs/installation.md#docker.
services:
  app:
    build: docker
    command: sh docker/start.sh
    # The project folder's owner, so the files the container writes stay the developer's. Docker Desktop maps any
    # user to the Mac's own; on Linux, set DOCKER_UID and DOCKER_GID when `id -u` is not 1000.
    user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
    volumes:
      - .:/app
    ports:
      - 127.0.0.1:${PORT:-8080}:8080
    environment:
      YII_ENV: dev
      # Read by config/dev.php, ahead of config/db.php
      DB_DSN: mysql:host=db;dbname=website
      DB_USER: root
      DB_PASSWORD: website
      # The test database, for `docker compose exec app composer check`
      MYSQL_DSN: mysql:host=db;dbname=website_test
      MYSQL_USER: root
      MYSQL_PASSWORD: website
      # The first user, created on the first start
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-website123}
      PORT: ${PORT:-8080}
      # The images of a page are each generated by a request of their own.
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, 'exit(@file_get_contents("http://127.0.0.1:8080/robots.txt") === false ? 1 : 0);']
      # Each check is a line in the log, so they are rare once the server is up.
      interval: 30s
      start_period: 10m
      start_interval: 2s

  # MariaDB rather than MySQL, as the migrations back up with the image's MariaDB `mysqldump`, which only trusts
  # the self-signed certificate of a MariaDB server.
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: website
    volumes:
      - db:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      retries: 30

volumes:
  db:
